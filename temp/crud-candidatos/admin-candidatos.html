<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Candidatos — GGC Awards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<!--
  ADMIN ONLY. Para ligar no Supabase, inclua o client (ou importe via npm):
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  e troque as funções da seção API no script abaixo.
-->
<style>
  :root{
    --bg:#E7E9E4; --ink:#15180F; --muted:#4F554B; --muted2:#3E423A; --card:#fff; --line:#E3E6DF; --line2:#EEF0EB;
    --borda:#C9CEC3; --campo:#FAFBF8; --foco:#1F5FBF; --ok:#35A55A; --ok-sombra:#1B6332; --perigo:#B42318;
    --sel:#E6F4EA; --sel-borda:#2E8A4C;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
  button,input{font-family:inherit}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  .pagina{min-height:100vh;padding:32px 24px 64px}
  .wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:24px}

  .topo{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px}
  .topo .sobre{font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  h1{margin:4px 0;font-family:'Space Grotesk',Inter,sans-serif;font-size:36px;line-height:1.1}
  .resumo{font-size:15px;color:var(--muted)}

  .btn{min-height:46px;padding:0 18px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;
    transition:background .15s,transform .06s}
  .btn:active{transform:translateY(1px)}
  .btn:focus-visible,.icone:focus-visible,.seg:focus-visible{outline:3px solid var(--foco);outline-offset:2px}
  .btn-escuro{min-height:48px;padding:0 20px;border:0;border-radius:12px;background:var(--ink);color:#fff}
  .btn-escuro:hover{background:#2A2E24}
  .btn-claro{border:1.5px solid var(--borda);background:#fff;color:var(--ink)}
  .btn-claro:hover{background:#F2F5F0}
  .btn-ok{border:0;padding:0 22px;background:var(--ok);color:#0B1A0F;font-weight:700;box-shadow:0 3px 0 var(--ok-sombra)}
  .btn-ok:hover{background:#2F9550}
  .btn-ok:disabled{opacity:.7;cursor:wait}
  .btn-perigo{border:0;background:var(--perigo);color:#fff;font-weight:700}
  .btn-perigo:hover{background:#951B12}
  .btn-texto-perigo{border:0;background:transparent;color:var(--perigo);padding:0 14px}
  .btn-texto-perigo:hover{background:#FDECEA}

  /* card da lista */
  .card{background:var(--card);border-radius:18px;box-shadow:0 10px 30px rgba(30,35,25,.10);overflow:hidden}
  .barra{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
  .busca-box{flex:1 1 280px;max-width:420px;position:relative;display:flex}
  .busca-box svg{position:absolute;left:14px;top:13px}
  .campo{height:46px;width:100%;padding:0 14px;border:1.5px solid var(--borda);border-radius:10px;font-size:15px;color:var(--ink);background:var(--campo)}
  .campo:focus{outline:none;border-color:var(--foco);box-shadow:0 0 0 3px rgba(31,95,191,.18)}
  .campo.invalido{border-color:var(--perigo)}
  .busca-box .campo{height:44px;padding-left:40px}
  .ordem{display:inline-flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:var(--muted2)}
  .segmentos{display:inline-flex;padding:4px;border-radius:12px;background:var(--line2);gap:4px}
  .seg{min-height:36px;padding:0 14px;border:0;border-radius:9px;font-size:14px;font-weight:600;background:transparent;color:var(--muted);cursor:pointer}
  .seg[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(21,24,15,.15)}

  .cabecalho{display:flex;align-items:center;gap:14px;padding:10px 20px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
  .col-foto{width:48px;flex:0 0 auto}
  .col-nome{flex:1;min-width:0}
  .col-num{width:52px;flex:0 0 auto;text-align:center}
  .col-acoes{width:100px;flex:0 0 auto;text-align:right;display:inline-flex;justify-content:flex-end;gap:4px}

  .lista{max-height:640px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#B9BEB4 transparent}
  .linha{display:flex;align-items:center;gap:14px;padding:10px 20px;border-bottom:1px solid var(--line2);transition:background .15s}
  .linha:hover{background:#F7F9F5}
  .avatar{width:48px;height:48px;border-radius:50%;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;object-fit:cover}
  .nome-txt{display:flex;flex-direction:column;gap:2px}
  .nome-txt b,.nome-txt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nome-txt b{font-size:15px;font-weight:600}
  .nome-txt span{font-size:13px;color:var(--muted)}
  .num{flex:0 0 auto;min-width:52px;height:40px;padding:0 8px;border-radius:8px;background:var(--ink);color:#fff;display:inline-flex;align-items:center;justify-content:center;
    font:700 22px Arial,sans-serif;letter-spacing:.04em}
  .icone{width:44px;height:44px;border:0;border-radius:10px;background:transparent;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s}
  .icone:hover{background:#EEF1EB}
  .icone.perigo{color:var(--perigo)}
  .icone.perigo:hover{background:#FDECEA;color:#951B12}
  .vazio{padding:48px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;color:var(--muted);font-size:14px}
  .vazio b{font-size:16px;font-weight:600;color:var(--ink)}

  /* modais */
  .fundo-modal{position:fixed;inset:0;z-index:20;background:rgba(21,24,15,.45);display:flex;align-items:center;justify-content:center;padding:16px}
  .fundo-modal[hidden]{display:none}
  .modal{width:100%;max-width:540px;max-height:92vh;overflow-y:auto;background:#fff;border-radius:20px;box-shadow:0 30px 70px rgba(21,24,15,.3);
    display:flex;flex-direction:column;animation:surge .2s cubic-bezier(.2,.8,.2,1) both}
  .modal.pequeno{max-width:420px;padding:24px;gap:16px}
  @keyframes surge{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
  .modal-topo{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 24px;border-bottom:1px solid var(--line)}
  .modal h2{margin:0;font-family:'Space Grotesk',Inter,sans-serif;font-size:22px}
  .modal-corpo{padding:20px 24px;display:flex;flex-direction:column;gap:18px}
  .modal-rodape{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
  .modal.pequeno .modal-rodape{padding:0;border:0}
  .modal.pequeno p{margin:0;font-size:15px;line-height:1.5;color:var(--muted2)}
  .modal.pequeno strong{color:var(--ink)}

  .grupo{display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:600}
  .opcional{font-weight:400;color:var(--muted)}
  .ajuda{font-size:13px;font-weight:400;color:var(--muted)}
  .ajuda.erro{color:var(--perigo);font-weight:500}

  /* número estilo urna */
  .numero-linha{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .caixas{position:relative;display:inline-flex;gap:6px}
  .caixa{width:48px;height:60px;border:2px solid var(--borda);display:inline-flex;align-items:center;justify-content:center;font:700 36px Arial,sans-serif;background:#F7F8F3}
  .caixas.invalido .caixa{border-color:var(--perigo)}
  .caixas:focus-within{outline:3px solid rgba(31,95,191,.35);outline-offset:4px;border-radius:6px}
  .caixas:focus-within .caixa.atual{animation:cursor .9s steps(1) infinite;border-color:#111}
  @keyframes cursor{0%,49%{border-color:#111}50%,100%{border-color:var(--borda)}}
  .caixas input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;cursor:text}

  /* foto */
  .foto-linha{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .foto-grande{width:72px;height:72px;border-radius:50%;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:#fff;object-fit:cover}
  img.foto-grande{border:2px solid var(--line)}
  .seletor{position:relative;min-height:46px;padding:0 16px;border:1.5px solid var(--borda);border-radius:10px;background:#fff;color:var(--ink);font-size:15px;font-weight:600;
    display:inline-flex;align-items:center;gap:8px;cursor:pointer;transition:background .15s}
  .seletor:hover{background:#F2F5F0}
  .seletor:focus-within{outline:3px solid var(--foco);outline-offset:2px}
  .seletor input{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;left:0;top:0}

  /* prévia */
  .previa-titulo{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .previa{display:flex;align-items:center;gap:14px;padding:10px 12px;border:1.5px solid var(--sel-borda);border-radius:12px;background:var(--sel)}

  /* aviso */
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:30;padding:12px 18px;border-radius:12px;background:var(--ink);color:#fff;
    font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:10px;box-shadow:0 12px 30px rgba(21,24,15,.3);animation:sobe .2s ease both}
  .toast[hidden]{display:none}
  .toast.erro svg{stroke:#FF8A80}
  @keyframes sobe{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

  @media (max-width:560px){
    .pagina{padding:24px 16px 48px}
    h1{font-size:30px}
    .cabecalho .col-foto{display:none}
    .linha{gap:10px;padding:10px 12px}
    .col-acoes{width:auto}
  }
</style>
</head>
<body>
<div class="pagina">
  <div class="wrap">
    <header class="topo">
      <div>
        <span class="sobre">GGC Awards · Admin</span>
        <h1>Candidatos</h1>
        <span class="resumo" id="resumo"></span>
      </div>
      <button class="btn btn-escuro" type="button" id="btn-novo">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        Novo candidato
      </button>
    </header>

    <section class="card" aria-label="Lista de candidatos">
      <div class="barra">
        <label class="busca-box">
          <span class="sr">Buscar candidato</span>
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4F554B" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input class="campo" id="busca" type="search" placeholder="Buscar por nome, apelido ou número" autocomplete="off">
        </label>
        <div class="ordem">
          <span id="rotulo-ordem">Ordenar por</span>
          <div class="segmentos" role="group" aria-labelledby="rotulo-ordem">
            <button class="seg" type="button" data-ordem="numero" aria-pressed="true">Número</button>
            <button class="seg" type="button" data-ordem="nome" aria-pressed="false">Nome</button>
          </div>
        </div>
      </div>
      <div class="cabecalho" aria-hidden="true">
        <span class="col-foto">Foto</span>
        <span class="col-nome">Nome e apelido</span>
        <span class="col-num">Nº</span>
        <span class="col-acoes">Ações</span>
      </div>
      <div class="lista" id="lista"></div>
    </section>
  </div>
</div>

<!-- MODAL: criar / editar -->
<div class="fundo-modal" id="modal-form" hidden>
  <form class="modal" id="form" role="dialog" aria-modal="true" aria-labelledby="titulo-form" novalidate>
    <div class="modal-topo">
      <h2 id="titulo-form">Novo candidato</h2>
      <button class="icone" type="button" data-fechar aria-label="Fechar">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
      </button>
    </div>

    <div class="modal-corpo">
      <div class="grupo">
        <label for="campo-numero">Número na urna</label>
        <div class="numero-linha">
          <div class="caixas" id="caixas">
            <span class="caixa" aria-hidden="true"></span>
            <span class="caixa" aria-hidden="true"></span>
            <input id="campo-numero" type="text" inputmode="numeric" autocomplete="off" maxlength="2" aria-describedby="ajuda-numero">
          </div>
          <span class="ajuda" id="ajuda-numero" style="max-width:300px"></span>
        </div>
      </div>

      <label class="grupo">Nome completo
        <input class="campo" id="campo-nome" type="text" autocomplete="off" placeholder="Ex.: Ana Beatriz Lima" aria-describedby="erro-nome">
        <span class="ajuda erro" id="erro-nome" hidden></span>
      </label>

      <label class="grupo">
        <span>Apelido <span class="opcional">(opcional)</span></span>
        <input class="campo" id="campo-apelido" type="text" autocomplete="off" placeholder="Ex.: Bia">
      </label>

      <div class="grupo">
        <span id="rotulo-foto">Foto <span class="opcional">(opcional, sem foto aparecem as iniciais)</span></span>
        <div class="foto-linha">
          <span id="foto-grande"></span>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <label class="seletor">
              <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M21 17l-5-5-8 8"/></svg>
              <span id="rotulo-seletor">Escolher foto</span>
              <input id="campo-foto" type="file" accept="image/*" aria-labelledby="rotulo-foto">
            </label>
            <button class="btn btn-texto-perigo" type="button" id="btn-remover-foto" hidden>Remover</button>
          </div>
        </div>
        <span class="ajuda" id="ajuda-foto">No celular abre a galeria ou a câmera. JPG, PNG ou WEBP de até 5 MB.</span>
      </div>

      <div class="grupo">
        <span class="previa-titulo">Como aparece na urna</span>
        <div class="previa" id="previa"></div>
      </div>
    </div>

    <div class="modal-rodape">
      <button class="btn btn-claro" type="button" data-fechar>Cancelar</button>
      <button class="btn btn-ok" type="submit" id="btn-salvar">Cadastrar</button>
    </div>
  </form>
</div>

<!-- MODAL: excluir -->
<div class="fundo-modal" id="modal-excluir" hidden>
  <div class="modal pequeno" role="alertdialog" aria-modal="true" aria-labelledby="titulo-excluir" aria-describedby="texto-excluir">
    <h2 id="titulo-excluir">Excluir candidato?</h2>
    <p id="texto-excluir"></p>
    <div class="modal-rodape">
      <button class="btn btn-claro" type="button" data-fechar>Cancelar</button>
      <button class="btn btn-perigo" type="button" id="btn-confirmar-exclusao">Excluir</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" hidden>
  <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4CD07D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>
  <span id="toast-texto"></span>
</div>

<script>
/* =====================================================================
   CRUD DE CANDIDATOS (só admin)
   Tabela "candidatos": numero (text, 2 dígitos, unique) | nome | apelido | foto_url (nullable)
   Fotos: bucket público "fotos" no Supabase Storage.
   ===================================================================== */

const CANDIDATOS_MOCK = [
  { numero: '10', nome: 'Ana Beatriz Lima',  apelido: 'Bia',        foto_url: null },
  { numero: '12', nome: 'Bruno Carvalho',    apelido: 'Brunão',     foto_url: null },
  { numero: '13', nome: 'Camila Ferreira',   apelido: 'Cami',       foto_url: null },

  { numero: '25', nome: 'Gabriela Moura',    apelido: 'Gabi',       foto_url: null },
  { numero: '31', nome: 'Henrique Tavares',  apelido: 'Rique',      foto_url: null },
  { numero: '40', nome: 'Isabela Costa',     apelido: 'Isa',        foto_url: null },
  { numero: '45', nome: 'João Pedro Nunes',  apelido: 'JP',         foto_url: null },
  { numero: '50', nome: 'Larissa Mendes',    apelido: 'Lari',       foto_url: null },
  { numero: '55', nome: 'Marcelo Pires',     apelido: 'Marcelinho', foto_url: null },
  { numero: '65', nome: 'Natália Ribeiro',   apelido: 'Nati',       foto_url: null },
  { numero: '70', nome: 'Otávio Barros',     apelido: 'Tavinho',    foto_url: null },
  { numero: '77', nome: 'Paula Gomes',       apelido: 'Paulinha',   foto_url: null },
  { numero: '80', nome: 'Rafael Teixeira',   apelido: 'Rafa',       foto_url: null },
  { numero: '88', nome: 'Tiago Almeida',     apelido: 'Ti',         foto_url: null },
  { numero: '99', nome: 'Vinícius Araújo',   apelido: 'Vini',       foto_url: null },
];

/* ======================= API — troque pelo Supabase =======================
   const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
*/
const api = {
  // const { data, error } = await supabase.from('candidatos').select('numero, nome, apelido, foto_url');
  // if (error) throw error; return data;
  async listar() { return CANDIDATOS_MOCK.map((c) => ({ ...c })); },

  // const { error } = await supabase.from('candidatos').insert(c); if (error) throw error;
  async criar(c) {},

  // const { error } = await supabase.from('candidatos').update(c).eq('numero', numeroOriginal); if (error) throw error;
  async atualizar(numeroOriginal, c) {},

  // const { error } = await supabase.from('candidatos').delete().eq('numero', numero); if (error) throw error;
  async remover(numero) {},

  // const ext = (arquivo.name.split('.').pop() || 'jpg').toLowerCase();
  // const caminho = numero + '-' + Date.now() + '.' + ext;
  // const { error } = await supabase.storage.from('fotos').upload(caminho, arquivo, { upsert: true });
  // if (error) throw error;
  // return supabase.storage.from('fotos').getPublicUrl(caminho).data.publicUrl;
  async enviarFoto(arquivo, numero) { return URL.createObjectURL(arquivo); }, // mock: URL local
};
/* ========================================================================= */

const FOTO_MAX_MB = 5;
const CORES_AVATAR = ['#2F5D8A','#7A3E8E','#A0442C','#2E7D5B','#8A6A1F','#3B4A9C','#9C2F5A','#256C78','#5E6B21','#6B3FA0'];

const estado = {
  candidatos: [],
  busca: '',
  ordem: 'numero',
  form: null,        // { modo: 'novo'|'editar', numeroOriginal, numero, nome, apelido, foto_url, fotoArquivo, fotoPrevia }
  excluindo: null,
  salvando: false,
};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const cor = (numero) => { const n = parseInt(numero, 10); return CORES_AVATAR[(isNaN(n) ? 0 : n) % CORES_AVATAR.length]; };
const iniciais = (nome) => {
  const p = String(nome || '').trim().split(/\s+/).filter(Boolean);
  if (!p.length) return '?';
  return ((p[0][0] || '') + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase();
};
const avatar = (foto, nome, numero, classe, alt = '') => foto
  ? `<img class="${classe}" src="${esc(foto)}" alt="${esc(alt)}">`
  : `<span class="${classe}" aria-hidden="true" style="background:${cor(numero)}">${esc(iniciais(nome))}</span>`;

let ultimoFoco = null;
let timerToast;

/* ---------------- aviso ---------------- */
function avisar(msg, erro = false) {
  clearTimeout(timerToast);
  $('toast-texto').textContent = msg;
  $('toast').classList.toggle('erro', erro);
  $('toast').hidden = false;
  timerToast = setTimeout(() => { $('toast').hidden = true; }, 2800);
}

/* ---------------- lista ---------------- */
function renderLista() {
  const termo = estado.busca.trim().toLowerCase();
  const lista = estado.candidatos
    .filter((c) => !termo || c.nome.toLowerCase().includes(termo) || (c.apelido || '').toLowerCase().includes(termo) || c.numero.includes(termo))
    .sort((a, b) => estado.ordem === 'numero' ? a.numero.localeCompare(b.numero) : a.nome.localeCompare(b.nome, 'pt-BR'));

  $('resumo').textContent = `${estado.candidatos.length} na disputa · ${100 - estado.candidatos.length} números livres`;
  document.querySelectorAll('.seg').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.ordem === estado.ordem)));

  if (!lista.length) {
    $('lista').innerHTML = estado.candidatos.length
      ? `<div class="vazio"><b>Ninguém encontrado</b>Tente outro nome ou número.</div>`
      : `<div class="vazio"><b>Nenhum candidato ainda</b>Use “Novo candidato” para cadastrar o primeiro.</div>`;
    return;
  }

  $('lista').innerHTML = lista.map((c) => `
    <div class="linha">
      ${avatar(c.foto_url, c.nome, c.numero, 'avatar')}
      <span class="col-nome nome-txt"><b>${esc(c.nome)}</b><span>${esc(c.apelido || 'Sem apelido')}</span></span>
      <span class="num">${esc(c.numero)}</span>
      <span class="col-acoes">
        <button class="icone" type="button" data-editar="${esc(c.numero)}" aria-label="Editar ${esc(c.nome)}">
          <svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>
        </button>
        <button class="icone perigo" type="button" data-excluir="${esc(c.numero)}" aria-label="Excluir ${esc(c.nome)}">
          <svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg>
        </button>
      </span>
    </div>`).join('');
}

/* ---------------- modal do formulário ---------------- */
function abrirModal(id) {
  ultimoFoco = document.activeElement;
  $(id).hidden = false;
}
function fecharModais() {
  $('modal-form').hidden = true;
  $('modal-excluir').hidden = true;
  if (estado.form && estado.form.fotoPrevia && estado.form.fotoArquivo) URL.revokeObjectURL(estado.form.fotoPrevia);
  estado.form = null;
  estado.excluindo = null;
  if (ultimoFoco) ultimoFoco.focus();
}

function abrirForm(c) {
  estado.form = c
    ? { modo: 'editar', numeroOriginal: c.numero, numero: c.numero, nome: c.nome, apelido: c.apelido || '', foto_url: c.foto_url || '', fotoArquivo: null, fotoPrevia: c.foto_url || '' }
    : { modo: 'novo', numeroOriginal: null, numero: '', nome: '', apelido: '', foto_url: '', fotoArquivo: null, fotoPrevia: '' };
  $('titulo-form').textContent = c ? 'Editar candidato' : 'Novo candidato';
  $('btn-salvar').textContent = c ? 'Salvar alterações' : 'Cadastrar';
  $('campo-numero').value = estado.form.numero;
  $('campo-nome').value = estado.form.nome;
  $('campo-apelido').value = estado.form.apelido;
  limparErros();
  renderForm();
  abrirModal('modal-form');
  $('campo-numero').focus();
}

function limparErros() {
  setErroNumero('');
  setErroNome('');
  setErroFoto('');
}
function setErroNumero(msg) {
  $('caixas').classList.toggle('invalido', !!msg);
  $('ajuda-numero').classList.toggle('erro', !!msg);
  $('ajuda-numero').textContent = msg || 'Dois dígitos, como na urna. Cada número só pode ter um dono.';
}
function setErroNome(msg) {
  $('campo-nome').classList.toggle('invalido', !!msg);
  $('erro-nome').hidden = !msg;
  $('erro-nome').textContent = msg;
}
function setErroFoto(msg) {
  $('ajuda-foto').classList.toggle('erro', !!msg);
  $('ajuda-foto').textContent = msg || 'No celular abre a galeria ou a câmera. JPG, PNG ou WEBP de até 5 MB.';
}

function renderForm() {
  const f = estado.form;
  if (!f) return;
  const caixas = $('caixas').querySelectorAll('.caixa');
  caixas.forEach((cx, i) => {
    cx.textContent = f.numero[i] || '';
    cx.classList.toggle('atual', f.numero.length === i);
  });

  $('foto-grande').outerHTML = `<span id="foto-grande">${avatar(f.fotoPrevia, f.nome, f.numero, 'foto-grande', 'Foto escolhida')}</span>`;
  $('rotulo-seletor').textContent = f.fotoPrevia ? 'Trocar foto' : 'Escolher foto';
  $('btn-remover-foto').hidden = !f.fotoPrevia;

  $('previa').innerHTML = `
    ${avatar(f.fotoPrevia, f.nome, f.numero, 'avatar')}
    <span class="col-nome nome-txt"><b>${esc(f.nome.trim() || 'Nome do candidato')}</b><span>${esc(f.apelido.trim() || 'Apelido')}</span></span>
    <span class="num">${esc(f.numero.padEnd(2, '–'))}</span>`;
}

function escolherFoto(input) {
  const arquivo = input.files && input.files[0];
  input.value = '';
  if (!arquivo || !estado.form) return;
  if (!arquivo.type.startsWith('image/')) return setErroFoto('Esse arquivo não é uma imagem.');
  if (arquivo.size > FOTO_MAX_MB * 1024 * 1024) return setErroFoto(`A foto passa de ${FOTO_MAX_MB} MB.`);
  setErroFoto('');
  if (estado.form.fotoArquivo) URL.revokeObjectURL(estado.form.fotoPrevia);
  estado.form.fotoArquivo = arquivo;
  estado.form.fotoPrevia = URL.createObjectURL(arquivo);
  renderForm();
}

function validar(f) {
  let ok = true;
  if (!/^\d{2}$/.test(f.numero)) { setErroNumero('Use 2 dígitos (00 a 99).'); ok = false; }
  else {
    const dono = estado.candidatos.find((c) => c.numero === f.numero && c.numero !== f.numeroOriginal);
    if (dono) { setErroNumero(`O ${f.numero} já é de ${dono.nome}.`); ok = false; }
  }
  if (!f.nome.trim()) { setErroNome('Coloque o nome.'); ok = false; }
  return ok;
}

async function salvar() {
  const f = estado.form;
  if (!f || estado.salvando || !validar(f)) return;
  estado.salvando = true;
  $('btn-salvar').disabled = true;
  try {
    let foto_url = f.foto_url || null;
    if (f.fotoArquivo) foto_url = await api.enviarFoto(f.fotoArquivo, f.numero);
    else if (!f.fotoPrevia) foto_url = null;
    const registro = { numero: f.numero, nome: f.nome.trim(), apelido: f.apelido.trim(), foto_url };

    if (f.modo === 'novo') {
      await api.criar(registro);
      estado.candidatos.push(registro);
      avisar(`${registro.nome} entrou na disputa.`);
    } else {
      await api.atualizar(f.numeroOriginal, registro);
      estado.candidatos = estado.candidatos.map((c) => c.numero === f.numeroOriginal ? registro : c);
      avisar('Alterações salvas.');
    }
    f.fotoArquivo = null; // não revogar a URL que agora está em uso
    fecharModais();
    renderLista();
  } catch (e) {
    console.error(e);
    avisar('Não deu para salvar. Tente de novo.', true);
  } finally {
    estado.salvando = false;
    $('btn-salvar').disabled = false;
  }
}

/* ---------------- exclusão ---------------- */
function pedirExclusao(c) {
  estado.excluindo = c;
  $('texto-excluir').innerHTML = `<strong>${esc(c.nome)}</strong> (número ${esc(c.numero)}) sai da lista e da urna. Não dá para desfazer.`;
  abrirModal('modal-excluir');
  $('btn-confirmar-exclusao').focus();
}

async function confirmarExclusao() {
  const alvo = estado.excluindo;
  if (!alvo) return;
  try {
    await api.remover(alvo.numero);
    estado.candidatos = estado.candidatos.filter((c) => c.numero !== alvo.numero);
    fecharModais();
    renderLista();
    avisar(`${alvo.nome} foi removido.`);
  } catch (e) {
    console.error(e);
    avisar('Não deu para excluir. Tente de novo.', true);
  }
}

/* ---------------- eventos ---------------- */
$('btn-novo').addEventListener('click', () => abrirForm(null));
$('busca').addEventListener('input', (e) => { estado.busca = e.target.value; renderLista(); });

document.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (b) {
    if (b.dataset.ordem) { estado.ordem = b.dataset.ordem; renderLista(); return; }
    if (b.dataset.editar) { abrirForm(estado.candidatos.find((c) => c.numero === b.dataset.editar)); return; }
    if (b.dataset.excluir) { pedirExclusao(estado.candidatos.find((c) => c.numero === b.dataset.excluir)); return; }
    if (b.hasAttribute('data-fechar')) { fecharModais(); return; }
  }
  // clique fora do modal fecha
  if (e.target.classList && e.target.classList.contains('fundo-modal')) fecharModais();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && (!$('modal-form').hidden || !$('modal-excluir').hidden)) fecharModais();
});

$('campo-numero').addEventListener('input', (e) => {
  const v = e.target.value.replace(/\D/g, '').slice(0, 2);
  e.target.value = v;
  estado.form.numero = v;
  setErroNumero('');
  renderForm();
});
$('campo-nome').addEventListener('input', (e) => { estado.form.nome = e.target.value; setErroNome(''); renderForm(); });
$('campo-apelido').addEventListener('input', (e) => { estado.form.apelido = e.target.value; renderForm(); });
$('campo-foto').addEventListener('change', (e) => escolherFoto(e.target));
$('btn-remover-foto').addEventListener('click', () => {
  const f = estado.form;
  if (f.fotoArquivo) URL.revokeObjectURL(f.fotoPrevia);
  f.fotoArquivo = null;
  f.fotoPrevia = '';
  f.foto_url = '';
  renderForm();
});
$('form').addEventListener('submit', (e) => { e.preventDefault(); salvar(); });
$('btn-confirmar-exclusao').addEventListener('click', confirmarExclusao);

/* ---------------- início ---------------- */
(async function iniciar() {
  try {
    estado.candidatos = await api.listar();
  } catch (e) {
    console.error(e);
    avisar('Não deu para carregar os candidatos.', true);
  }
  renderLista();
})();
</script>
</body>
</html>
