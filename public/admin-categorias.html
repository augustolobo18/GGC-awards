<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Categorias — GGC Awards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/jpeg" href="assets/logo_ggc.jpg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<style>
  :root{
    --bg:#E7E9E4; --ink:#15180F; --muted:#4F554B; --muted2:#3E423A; --card:#fff; --line:#E3E6DF; --line2:#EEF0EB;
    --borda:#C9CEC3; --campo:#FAFBF8; --foco:#1F5FBF; --ok:#35A55A; --ok-sombra:#1B6332; --perigo:#B42318;
    --sel:#E6F4EA; --sel-borda:#2E8A4C;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
  button,input{font-family:inherit}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  .pagina{min-height:100vh;padding:32px 24px 64px}
  .wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:24px}

  .topo{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px}
  .topo-acoes{display:flex;flex-wrap:wrap;gap:10px}
  .topo .sobre{font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  h1{margin:4px 0;font-family:'Space Grotesk',Inter,sans-serif;font-size:36px;line-height:1.1}
  .resumo{font-size:15px;color:var(--muted)}

  .btn{min-height:46px;padding:0 18px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;
    transition:background .15s,transform .06s}
  .btn:active{transform:translateY(1px)}
  .btn:focus-visible,.icone:focus-visible,.seg:focus-visible{outline:3px solid var(--foco);outline-offset:2px}
  .btn-escuro{min-height:48px;padding:0 20px;border:0;border-radius:12px;background:var(--ink);color:#fff}
  .btn-escuro:hover{background:#2A2E24}
  .btn-claro{border:1.5px solid var(--borda);background:#fff;color:var(--ink)}
  .btn-claro:hover{background:#F2F5F0}
  .btn-ok{border:0;padding:0 22px;background:var(--ok);color:#0B1A0F;font-weight:700;box-shadow:0 3px 0 var(--ok-sombra)}
  .btn-ok:hover{background:#2F9550}
  .btn-ok:disabled{opacity:.7;cursor:wait}
  .btn-perigo{border:0;background:var(--perigo);color:#fff;font-weight:700}
  .btn-perigo:hover{background:#951B12}
  .btn-texto-perigo{border:0;background:transparent;color:var(--perigo);padding:0 14px}
  .btn-texto-perigo:hover{background:#FDECEA}

  /* card da lista */
  .card{background:var(--card);border-radius:18px;box-shadow:0 10px 30px rgba(30,35,25,.10);overflow:hidden}
  .barra{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
  .busca-box{flex:1 1 280px;max-width:420px;position:relative;display:flex}
  .busca-box svg{position:absolute;left:14px;top:13px}
  .campo{height:46px;width:100%;padding:0 14px;border:1.5px solid var(--borda);border-radius:10px;font-size:15px;color:var(--ink);background:var(--campo)}
  .campo:focus{outline:none;border-color:var(--foco);box-shadow:0 0 0 3px rgba(31,95,191,.18)}
  .campo.invalido{border-color:var(--perigo)}
  .busca-box .campo{height:44px;padding-left:40px}
  .ordem{display:inline-flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:var(--muted2)}
  .segmentos{display:inline-flex;padding:4px;border-radius:12px;background:var(--line2);gap:4px}
  .seg{min-height:36px;padding:0 14px;border:0;border-radius:9px;font-size:14px;font-weight:600;background:transparent;color:var(--muted);cursor:pointer}
  .seg[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(21,24,15,.15)}

  .cabecalho{display:flex;align-items:center;gap:14px;padding:10px 20px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
  .col-foto{width:48px;flex:0 0 auto}
  .col-nome{flex:1;min-width:0}
  .col-num{width:52px;flex:0 0 auto;text-align:center}
  .col-acoes{width:100px;flex:0 0 auto;text-align:right;display:inline-flex;justify-content:flex-end;gap:4px}

  .lista{max-height:640px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#B9BEB4 transparent}
  .linha{display:flex;align-items:center;gap:14px;padding:10px 20px;border-bottom:1px solid var(--line2);transition:background .15s}
  .linha:hover{background:#F7F9F5}
  .avatar{width:48px;height:48px;border-radius:50%;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;object-fit:cover}
  .nome-txt{display:flex;flex-direction:column;gap:2px}
  .nome-txt b,.nome-txt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nome-txt b{font-size:15px;font-weight:600}
  .nome-txt span{font-size:13px;color:var(--muted)}
  .num{flex:0 0 auto;min-width:52px;height:40px;padding:0 8px;border-radius:8px;background:var(--ink);color:#fff;display:inline-flex;align-items:center;justify-content:center;
    font:700 22px Arial,sans-serif;letter-spacing:.04em}
  .icone{width:44px;height:44px;border:0;border-radius:10px;background:transparent;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s}
  .icone:hover{background:#EEF1EB}
  .icone.perigo{color:var(--perigo)}
  .icone.perigo:hover{background:#FDECEA;color:#951B12}
  .vazio{padding:48px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;color:var(--muted);font-size:14px}
  .vazio b{font-size:16px;font-weight:600;color:var(--ink)}

  /* modais */
  .fundo-modal{position:fixed;inset:0;z-index:20;background:rgba(21,24,15,.45);display:flex;align-items:center;justify-content:center;padding:16px}
  .fundo-modal[hidden]{display:none}
  .modal{width:100%;max-width:540px;max-height:92vh;overflow-y:auto;background:#fff;border-radius:20px;box-shadow:0 30px 70px rgba(21,24,15,.3);
    display:flex;flex-direction:column;animation:surge .2s cubic-bezier(.2,.8,.2,1) both}
  .modal.pequeno{max-width:420px;padding:24px;gap:16px}
  @keyframes surge{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
  .modal-topo{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 24px;border-bottom:1px solid var(--line)}
  .modal h2{margin:0;font-family:'Space Grotesk',Inter,sans-serif;font-size:22px}
  .modal-corpo{padding:20px 24px;display:flex;flex-direction:column;gap:18px}
  .modal-rodape{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
  .modal.pequeno .modal-rodape{padding:0;border:0}
  .modal.pequeno p{margin:0;font-size:15px;line-height:1.5;color:var(--muted2)}
  .modal.pequeno strong{color:var(--ink)}

  .grupo{display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:600}
  .opcional{font-weight:400;color:var(--muted)}
  .ajuda{font-size:13px;font-weight:400;color:var(--muted)}
  .ajuda.erro{color:var(--perigo);font-weight:500}

  /* número estilo urna */
  .numero-linha{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .caixas{position:relative;display:inline-flex;gap:6px}
  .caixa{width:48px;height:60px;border:2px solid var(--borda);display:inline-flex;align-items:center;justify-content:center;font:700 36px Arial,sans-serif;background:#F7F8F3}
  .caixas.invalido .caixa{border-color:var(--perigo)}
  .caixas:focus-within{outline:3px solid rgba(31,95,191,.35);outline-offset:4px;border-radius:6px}
  .caixas:focus-within .caixa.atual{animation:cursor .9s steps(1) infinite;border-color:#111}
  @keyframes cursor{0%,49%{border-color:#111}50%,100%{border-color:var(--borda)}}
  .caixas input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;cursor:text}

  /* foto */
  .foto-linha{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .foto-grande{width:72px;height:72px;border-radius:50%;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:#fff;object-fit:cover}
  img.foto-grande{border:2px solid var(--line)}
  .seletor{position:relative;min-height:46px;padding:0 16px;border:1.5px solid var(--borda);border-radius:10px;background:#fff;color:var(--ink);font-size:15px;font-weight:600;
    display:inline-flex;align-items:center;gap:8px;cursor:pointer;transition:background .15s}
  .seletor:hover{background:#F2F5F0}
  .seletor:focus-within{outline:3px solid var(--foco);outline-offset:2px}
  .seletor input{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;left:0;top:0}

  /* prévia */
  .previa-titulo{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .previa{display:flex;align-items:center;gap:14px;padding:10px 12px;border:1.5px solid var(--sel-borda);border-radius:12px;background:var(--sel)}

  /* aviso */
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:30;padding:12px 18px;border-radius:12px;background:var(--ink);color:#fff;
    font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:10px;box-shadow:0 12px 30px rgba(21,24,15,.3);animation:sobe .2s ease both}
  .toast[hidden]{display:none}
  .toast.erro svg{stroke:#FF8A80}
  @keyframes sobe{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

  /* categorias */
  a.sobre.voltar{display:inline-block;text-decoration:none}
  a.sobre.voltar:hover{color:var(--ink)}
  .info{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;background:#FFF4D6;border:1.5px solid #E8C766;font-size:14px;line-height:1.5;color:var(--muted2)}
  .info[hidden]{display:none}
  .info svg{flex:0 0 auto;margin-top:1px}
  .info strong{color:var(--ink)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .icone:disabled{cursor:not-allowed;opacity:.35}
  .icone:disabled:hover{background:transparent}
  .col-acoes{width:auto;flex:0 0 auto}
  .num{min-width:44px;height:34px;font-size:18px}
  .selo-principal{display:inline-block;margin-left:6px;padding:2px 10px;border-radius:999px;background:#FFC21A;color:#0B2A4A;font-size:12px;font-weight:800;letter-spacing:.03em;vertical-align:middle}
  textarea.campo{height:auto}
  .toggle{position:relative;display:flex;align-items:center;gap:12px;min-height:44px;cursor:pointer;font-size:14px;font-weight:600}
  .toggle input{position:absolute;opacity:0;width:46px;height:26px;margin:0;cursor:pointer}
  .toggle .trilho-sw{flex:0 0 auto;position:relative;width:46px;height:26px;border-radius:999px;background:var(--borda);transition:background .15s}
  .toggle .trilho-sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(21,24,15,.3);transition:transform .15s}
  .toggle input:checked + .trilho-sw{background:var(--ok)}
  .toggle input:checked + .trilho-sw::after{transform:translateX(20px)}
  .toggle input:focus-visible + .trilho-sw{outline:3px solid var(--foco);outline-offset:3px}
  .previa-urna{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border:2px solid #2B2D29;border-radius:6px;background:#EEF0E8;color:#111;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif}
  .previa-urna .seu{font-size:13px;font-weight:700}
  .previa-urna .tit{font-size:22px;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
  .previa-urna .desc{font-size:13px;color:#3E423A;overflow-wrap:anywhere}

  @media (max-width:560px){
    .pagina{padding:24px 16px 48px}
    h1{font-size:30px}
    .cabecalho .col-foto{display:none}
    .linha{gap:10px;padding:10px 12px}
    .col-acoes{width:auto}
  }
</style>
</head>
<body>
<div class="pagina">
  <div class="wrap">
    <header class="topo">
      <div>
        <a class="sobre voltar" href="admin-menu.html">← GGC Awards · Admin</a>
        <h1>Categorias</h1>
        <span class="resumo" id="resumo"></span>
      </div>
      <div class="topo-acoes">
        <button class="btn btn-claro" type="button" id="btn-limpar-tudo">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg>
          Limpar categorias
        </button>
        <button class="btn btn-escuro" type="button" id="btn-novo">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
          Nova categoria
        </button>
      </div>
    </header>

    <div class="info" id="aviso-aberta" hidden>
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6E4A00" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16.5v.01"/></svg>
      <span><strong>Votação aberta.</strong> As categorias ficam travadas até o encerramento.</span>
    </div>

    <section class="card" aria-label="Lista de categorias">
      <div class="barra">
        <label class="busca-box">
          <span class="sr">Buscar categoria</span>
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4F554B" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input class="campo" id="busca" type="search" placeholder="Buscar por título ou descrição" autocomplete="off">
        </label>
      </div>
      <div class="cabecalho" aria-hidden="true">
        <span class="col-num">Nº</span>
        <span class="col-nome">Categoria</span>
        <span class="col-acoes">Ordem e ações</span>
      </div>
      <div class="lista" id="lista"></div>
    </section>
  </div>
</div>

<!-- MODAL: criar / editar -->
<div class="fundo-modal" id="modal-form" hidden>
  <form class="modal" id="form" role="dialog" aria-modal="true" aria-labelledby="titulo-form" novalidate>
    <div class="modal-topo">
      <h2 id="titulo-form">Nova categoria</h2>
      <button class="icone" type="button" data-fechar aria-label="Fechar">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
      </button>
    </div>

    <div class="modal-corpo">
      <label class="grupo">Título
        <input class="campo" id="campo-titulo" type="text" autocomplete="off" placeholder="Ex.: Melhor no volante" aria-describedby="erro-titulo">
        <span class="ajuda erro" id="erro-titulo" hidden></span>
      </label>

      <label class="grupo">
        <span>Descrição <span class="opcional">(opcional)</span></span>
        <input class="campo" id="campo-descricao" type="text" autocomplete="off" placeholder="Ex.: Baliza de primeira, zero sustos.">
      </label>

      <div class="grupo">
        <label class="toggle">
          <input id="campo-principal" type="checkbox" aria-describedby="ajuda-principal">
          <span class="trilho-sw" aria-hidden="true"></span>
          GGC Of The Year (principal)
        </label>
        <span class="ajuda" id="ajuda-principal"></span>
      </div>

      <div class="grupo">
        <span class="previa-titulo">Como aparece na urna</span>
        <div class="previa-urna">
          <span class="seu">SEU VOTO PARA</span>
          <span class="tit" id="previa-titulo-cat"></span>
          <span class="desc" id="previa-desc-cat"></span>
        </div>
      </div>
    </div>

    <div class="modal-rodape">
      <button class="btn btn-claro" type="button" data-fechar>Cancelar</button>
      <button class="btn btn-ok" type="submit" id="btn-salvar">Criar categoria</button>
    </div>
  </form>
</div>

<!-- MODAL: excluir -->
<div class="fundo-modal" id="modal-excluir" hidden>
  <div class="modal pequeno" role="alertdialog" aria-modal="true" aria-labelledby="titulo-excluir" aria-describedby="texto-excluir">
    <h2 id="titulo-excluir">Excluir categoria?</h2>
    <p id="texto-excluir"></p>
    <div class="modal-rodape">
      <button class="btn btn-claro" type="button" data-fechar>Cancelar</button>
      <button class="btn btn-perigo" type="button" id="btn-confirmar-exclusao">Excluir</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" hidden>
  <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4CD07D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>
  <span id="toast-texto"></span>
</div>

<script>
/* =====================================================================
   CRUD DE CATEGORIAS (só admin e dev)
   Tabela "categorias": id | ordem | titulo | descricao | principal (só uma pode ser true)
   Marcar outra como principal desmarca a anterior no próprio banco (trigger unica_principal).
   Com a votação aberta o banco recusa qualquer alteração (trigger); aqui só desabilitamos os botões.
   Na urna a principal (GGC Of The Year) vem sempre por último, independente da ordem.
   ===================================================================== */

const COLUNAS = 'id, ordem, titulo, descricao, principal';

const api = {
  async status() {
    const { data, error } = await sb.from('eleicao').select('status').eq('id', 1).single();
    if (error) throw error;
    return data.status;
  },
  async limparTudo() {
    const { error } = await sb.rpc('limpar_categorias');
    if (error) throw error;
  },
  async listar() {
    const { data, error } = await sb.from('categorias').select(COLUNAS).order('ordem').order('titulo');
    if (error) throw error;
    return data;
  },
  async criar(reg) {
    const { error } = await sb.from('categorias').insert(reg);
    if (error) throw error;
  },
  async atualizar(id, reg) {
    const { data, error } = await sb.from('categorias').update(reg).eq('id', id).select('id');
    if (error) throw error;
    if (!data || !data.length) throw new Error('Sem permissão para alterar esta categoria.');
  },
  async remover(id) {
    const { data, error } = await sb.from('categorias').delete().eq('id', id).select('id');
    if (error) throw error;
    if (!data || !data.length) throw new Error('Sem permissão para excluir esta categoria.');
  },
};

const estado = {
  status: 'fechada',
  categorias: [],
  busca: '',
  form: null,        // { modo: 'novo'|'editar', id, titulo, descricao, principal }
  excluindo: null,
  ocupado: false,
};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const aberta = () => estado.status === 'aberta';

let ultimoFoco = null;
let timerToast;

/* ---------------- aviso ---------------- */
function avisar(msg, erro = false) {
  clearTimeout(timerToast);
  $('toast-texto').textContent = msg;
  $('toast').classList.toggle('erro', erro);
  $('toast').hidden = false;
  timerToast = setTimeout(() => { $('toast').hidden = true; }, erro ? 4500 : 2800);
}

async function recarregar() {
  estado.categorias = await api.listar();
}

/* ---------------- lista ---------------- */
function renderLista() {
  const termo = estado.busca.trim().toLowerCase();
  const todas = estado.categorias;
  const lista = todas
    .map((c, i) => ({ ...c, pos: i + 1 }))
    .filter((c) => !termo || c.titulo.toLowerCase().includes(termo) || (c.descricao || '').toLowerCase().includes(termo));

  const principal = todas.find((c) => c.principal);
  $('resumo').textContent = `${todas.length} ${todas.length === 1 ? 'categoria' : 'categorias'} · ${principal ? `principal: ${principal.titulo}` : 'sem categoria principal'}`;
  $('aviso-aberta').hidden = !aberta();
  $('btn-novo').disabled = aberta();
  $('btn-limpar-tudo').disabled = aberta() || !todas.length;

  if (!lista.length) {
    $('lista').innerHTML = todas.length
      ? `<div class="vazio"><b>Nada encontrado</b>Tente outro termo.</div>`
      : `<div class="vazio"><b>Nenhuma categoria ainda</b>Use “Nova categoria” para criar a primeira.</div>`;
    return;
  }

  const travaTxt = 'Com a votação aberta as categorias ficam travadas.';
  $('lista').innerHTML = lista.map((c) => {
    const pode = !aberta() && !termo;   // reordenar só com a lista completa
    const sobe = !pode || c.pos === 1;
    const desce = !pode || c.pos === todas.length;
    return `
    <div class="linha">
      <span class="num" title="Posição na urna">${c.pos}</span>
      <span class="col-nome nome-txt">
        <b>${esc(c.titulo)} ${c.principal ? '<span class="selo-principal">GGC Of The Year</span>' : ''}</b>
        <span>${esc(c.descricao || 'Sem descrição')}</span>
      </span>
      <span class="col-acoes">
        <button class="icone" type="button" data-sobe="${esc(c.id)}" ${sobe ? 'disabled' : ''} aria-label="Subir ${esc(c.titulo)}" title="${esc(aberta() ? travaTxt : 'Subir')}">
          <svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M6 11l6-6 6 6"/></svg>
        </button>
        <button class="icone" type="button" data-desce="${esc(c.id)}" ${desce ? 'disabled' : ''} aria-label="Descer ${esc(c.titulo)}" title="${esc(aberta() ? travaTxt : 'Descer')}">
          <svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M6 13l6 6 6-6"/></svg>
        </button>
        <button class="icone" type="button" data-editar="${esc(c.id)}" ${aberta() ? 'disabled' : ''} aria-label="Editar ${esc(c.titulo)}" title="${esc(aberta() ? travaTxt : 'Editar')}">
          <svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>
        </button>
        <button class="icone perigo" type="button" data-excluir="${esc(c.id)}" ${aberta() ? 'disabled' : ''} aria-label="Excluir ${esc(c.titulo)}" title="${esc(aberta() ? travaTxt : 'Excluir')}">
          <svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg>
        </button>
      </span>
    </div>`;
  }).join('');
}

/* ---------------- reordenar ---------------- */
async function mover(id, delta) {
  if (estado.ocupado || aberta()) return;
  const arr = estado.categorias.slice();
  const i = arr.findIndex((c) => c.id === id);
  const j = i + delta;
  if (i < 0 || j < 0 || j >= arr.length) return;
  [arr[i], arr[j]] = [arr[j], arr[i]];
  estado.ocupado = true;
  try {
    // renumera 1..n e grava só o que mudou
    await Promise.all(arr.map((c, k) => c.ordem === k + 1 ? null : api.atualizar(c.id, { ordem: k + 1 })).filter(Boolean));
  } catch (e) {
    console.error(e);
    avisar(GGC.msgErro(e, 'Não deu para reordenar. Tente de novo.'), true);
  } finally {
    try { await recarregar(); } catch (e) { console.error(e); }
    estado.ocupado = false;
    renderLista();
  }
}

/* ---------------- modal do formulário ---------------- */
function abrirModal(id) {
  ultimoFoco = document.activeElement;
  $(id).hidden = false;
}
function fecharModais() {
  $('modal-form').hidden = true;
  $('modal-excluir').hidden = true;
  estado.form = null;
  estado.excluindo = null;
  if (ultimoFoco && document.contains(ultimoFoco)) ultimoFoco.focus();
}

function abrirForm(c) {
  estado.form = c
    ? { modo: 'editar', id: c.id, titulo: c.titulo, descricao: c.descricao || '', principal: c.principal }
    : { modo: 'novo', id: null, titulo: '', descricao: '', principal: false };
  const f = estado.form;
  $('titulo-form').textContent = c ? 'Editar categoria' : 'Nova categoria';
  $('btn-salvar').textContent = c ? 'Salvar alterações' : 'Criar categoria';
  $('campo-titulo').value = f.titulo;
  $('campo-descricao').value = f.descricao;
  $('campo-principal').checked = f.principal;
  setErroTitulo('');
  renderForm();
  abrirModal('modal-form');
  $('campo-titulo').focus();
}

function setErroTitulo(msg) {
  $('campo-titulo').classList.toggle('invalido', !!msg);
  $('erro-titulo').hidden = !msg;
  $('erro-titulo').textContent = msg;
}

function renderForm() {
  const f = estado.form;
  if (!f) return;
  const atual = estado.categorias.find((c) => c.principal && c.id !== f.id);
  $('ajuda-principal').textContent = f.principal && atual
    ? `“${atual.titulo}” deixa de ser a principal.`
    : 'O grande prêmio: aparece em destaque na apuração e vem por último na urna.';
  $('previa-titulo-cat').textContent = (f.titulo.trim() || 'Título da categoria').toUpperCase();
  $('previa-desc-cat').textContent = f.descricao.trim() || 'Descrição da categoria';
}

function validar(f) {
  const t = f.titulo.trim();
  if (!t) { setErroTitulo('Coloque o título.'); return false; }
  const igual = estado.categorias.find((c) => c.id !== f.id && c.titulo.trim().toLowerCase() === t.toLowerCase());
  if (igual) { setErroTitulo('Já existe uma categoria com esse título.'); return false; }
  return true;
}

async function salvar() {
  const f = estado.form;
  if (!f || estado.ocupado || !validar(f)) return;
  estado.ocupado = true;
  $('btn-salvar').disabled = true;
  try {
    const reg = { titulo: f.titulo.trim(), descricao: f.descricao.trim() || null, principal: f.principal };
    if (f.modo === 'novo') {
      const maior = estado.categorias.reduce((m, c) => Math.max(m, c.ordem), 0);
      await api.criar({ ...reg, ordem: maior + 1 });
      avisar(`${reg.titulo} foi criada.`);
    } else {
      await api.atualizar(f.id, reg);
      avisar('Alterações salvas.');
    }
    await recarregar();   // a principal anterior pode ter sido desmarcada pelo banco
    fecharModais();
    renderLista();
  } catch (e) {
    console.error(e);
    avisar(GGC.msgErro(e, 'Não deu para salvar. Tente de novo.'), true);
  } finally {
    estado.ocupado = false;
    $('btn-salvar').disabled = false;
  }
}

/* ---------------- exclusão ---------------- */
function pedirExclusao(c) {
  estado.excluindo = c;
  $('titulo-excluir').textContent = 'Excluir categoria?';
  $('btn-confirmar-exclusao').textContent = 'Excluir';
  $('texto-excluir').innerHTML = `<strong>${esc(c.titulo)}</strong> sai da lista e da urna. Não dá para desfazer.`;
  abrirModal('modal-excluir');
  $('btn-confirmar-exclusao').focus();
}

// Limpar o painel: apaga todas as categorias (inclusive a principal) para montar do zero.
// O resultado de anos anteriores não muda: está congelado no histórico.
function pedirLimpeza() {
  if (aberta() || !estado.categorias.length) return;
  estado.excluindo = { todas: true };
  $('titulo-excluir').textContent = 'Limpar todas as categorias?';
  $('btn-confirmar-exclusao').textContent = 'Limpar tudo';
  $('texto-excluir').innerHTML = `As <strong>${estado.categorias.length}</strong> categorias saem da lista e da urna, inclusive o GGC Of The Year. ` +
    'Você monta tudo do zero (lembre de marcar uma como principal). Os resultados de anos anteriores não mudam. Não dá para desfazer.';
  abrirModal('modal-excluir');
  $('btn-confirmar-exclusao').focus();
}

async function confirmarExclusao() {
  const alvo = estado.excluindo;
  if (!alvo || estado.ocupado) return;
  estado.ocupado = true;
  try {
    if (alvo.todas) await api.limparTudo(); else await api.remover(alvo.id);
    await recarregar();
    ultimoFoco = $('btn-novo');
    fecharModais();
    renderLista();
    avisar(alvo.todas ? 'Categorias limpas. Monte as novas do zero.' : `${alvo.titulo} foi excluída.`);
  } catch (e) {
    console.error(e);
    avisar(GGC.msgErro(e, 'Não deu para excluir. Tente de novo.'), true);
  } finally {
    estado.ocupado = false;
  }
}

/* ---------------- eventos ---------------- */
$('btn-novo').addEventListener('click', () => { if (!aberta()) abrirForm(null); });
$('btn-limpar-tudo').addEventListener('click', pedirLimpeza);
$('busca').addEventListener('input', (e) => { estado.busca = e.target.value; renderLista(); });

document.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (b && !b.disabled) {
    if (b.dataset.sobe) { mover(b.dataset.sobe, -1); return; }
    if (b.dataset.desce) { mover(b.dataset.desce, 1); return; }
    if (b.dataset.editar) { abrirForm(estado.categorias.find((c) => c.id === b.dataset.editar)); return; }
    if (b.dataset.excluir) { pedirExclusao(estado.categorias.find((c) => c.id === b.dataset.excluir)); return; }
    if (b.hasAttribute('data-fechar')) { fecharModais(); return; }
  }
  if (e.target.classList && e.target.classList.contains('fundo-modal')) fecharModais();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && (!$('modal-form').hidden || !$('modal-excluir').hidden)) fecharModais();
});

$('campo-titulo').addEventListener('input', (e) => { estado.form.titulo = e.target.value; setErroTitulo(''); renderForm(); });
$('campo-descricao').addEventListener('input', (e) => { estado.form.descricao = e.target.value; renderForm(); });
$('campo-principal').addEventListener('change', (e) => { estado.form.principal = e.target.checked; renderForm(); });
$('form').addEventListener('submit', (e) => { e.preventDefault(); salvar(); });
$('btn-confirmar-exclusao').addEventListener('click', confirmarExclusao);

/* ---------------- início ---------------- */
(async function iniciar() {
  await GGC.exigirSessao({ roles: ['admin', 'dev'] });
  try {
    const [status] = await Promise.all([api.status(), recarregar()]);
    estado.status = status;
  } catch (e) {
    console.error(e);
    avisar('Não deu para carregar as categorias.', true);
  }
  renderLista();
})();
</script>
