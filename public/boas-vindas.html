<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boas-vindas — GGC Awards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" type="image/jpeg" href="assets/logo_ggc.jpg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/texto.js"></script>
<style>
  :root{
    --azul:#0A63AD; --ciano:#2EC4F0; --ciano-claro:#7FE0FF; --amarelo:#FFC21A; --laranja:#FF9F1C;
    --marinho:#0B2A4A;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--azul);font-family:Nunito,system-ui,sans-serif;color:#fff}

  .fundo{position:relative;min-height:100vh;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 16px}
  .agua{position:absolute;inset:0;background-color:var(--azul);
    background-image:radial-gradient(circle at 20% 20%,rgba(94,214,255,.55) 0,transparent 45%),
                     radial-gradient(circle at 80% 85%,rgba(31,168,232,.7) 0,transparent 50%);
    background-size:160% 160%,160% 160%;animation:ondula 18s ease-in-out infinite}
  .mancha{position:absolute;border-radius:50%}
  .m1{width:520px;height:520px;left:8%;top:6%;background:var(--ciano);filter:blur(10px);opacity:.9;animation:deriva1 16s ease-in-out infinite}
  .m2{width:380px;height:380px;right:14%;top:18%;background:var(--amarelo);opacity:.95;animation:deriva2 19s ease-in-out infinite}
  .m3{width:460px;height:460px;left:34%;bottom:-12%;background:var(--laranja);opacity:.75;animation:deriva3 22s ease-in-out infinite}
  .m4{width:300px;height:300px;right:4%;bottom:4%;background:var(--ciano-claro);opacity:.7;animation:deriva1 16s ease-in-out infinite}
  @keyframes deriva1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(80px,-60px) scale(1.15)}}
  @keyframes deriva2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-90px,70px) scale(.9)}}
  @keyframes deriva3{0%,100%{transform:translate(0,0)}50%{transform:translate(50px,90px)}}
  @keyframes ondula{0%,100%{background-position:0% 0%,100% 100%}50%{background-position:100% 50%,0% 50%}}

  .vidro{position:relative;z-index:1;width:100%;max-width:640px;padding:40px 36px 32px;border-radius:32px;background:rgba(8,44,88,.42);
    -webkit-backdrop-filter:blur(26px) saturate(160%);backdrop-filter:blur(26px) saturate(160%);border:1.5px solid rgba(255,255,255,.45);
    box-shadow:0 30px 60px rgba(4,30,64,.35),inset 0 1px 0 rgba(255,255,255,.5);display:flex;flex-direction:column;gap:22px;
    animation:entra .6s cubic-bezier(.2,.8,.2,1) both}
  @keyframes entra{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}

  .marca{font-family:'Lilita One',Nunito,sans-serif;font-size:22px;letter-spacing:.06em;color:var(--amarelo);text-align:center;
    -webkit-text-stroke:1.5px var(--marinho);paint-order:stroke fill;text-shadow:0 3px 0 var(--marinho)}
  h1{margin:0;font-family:'Lilita One',Nunito,sans-serif;font-weight:400;font-size:38px;line-height:1.1;color:#fff;text-align:center;
    text-shadow:0 3px 0 var(--marinho)}
  h1:empty{display:none}

  /* texto do admin: rolável se for longo, com leitura confortável */
  .texto{max-height:52vh;overflow-y:auto;padding:4px 6px 4px 2px;font-size:17px;line-height:1.6;font-weight:600;
    scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.5) transparent}
  .texto p{margin:0 0 14px}
  .texto p:last-child{margin-bottom:0}
  .texto strong{font-weight:900;color:#FFE38A}
  .texto em{font-style:italic}

  .acao{width:100%;min-height:64px;border-radius:20px;display:inline-flex;align-items:center;justify-content:center;gap:12px;
    font-family:'Lilita One',Nunito,sans-serif;letter-spacing:.02em;text-decoration:none;cursor:pointer}
  .btn-seguir{border:3px solid var(--marinho);background:var(--amarelo);color:var(--marinho);font-size:24px;box-shadow:0 5px 0 var(--marinho);
    transition:transform .1s,filter .15s}
  .btn-seguir:hover{filter:brightness(1.05)}
  .btn-seguir:active{transform:translateY(3px)}
  .btn-seguir:focus-visible,.voltar:focus-visible{outline:3px solid #fff;outline-offset:3px}
  .voltar{align-self:center;color:#fff;font-size:15px;font-weight:800;text-decoration:underline;text-underline-offset:4px}
  .aviso-previa{align-self:center;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.92);color:var(--marinho);font-size:13px;font-weight:900;letter-spacing:.06em;text-transform:uppercase}
  .aviso-previa[hidden]{display:none}

  @media (max-width:480px){
    .vidro{padding:30px 20px 24px;border-radius:26px;gap:18px}
    h1{font-size:30px}
    .texto{font-size:16px;max-height:56vh}
    .btn-seguir{font-size:21px}
  }
  @media (prefers-reduced-motion: reduce){ .agua,.mancha,.vidro{animation:none} }
</style>
</head>
<body>
<main class="fundo">
  <div class="agua" aria-hidden="true"></div>
  <div class="mancha m1" aria-hidden="true"></div>
  <div class="mancha m2" aria-hidden="true"></div>
  <div class="mancha m3" aria-hidden="true"></div>
  <div class="mancha m4" aria-hidden="true"></div>

  <section class="vidro" aria-labelledby="titulo">
    <span class="aviso-previa" id="aviso-previa" hidden>Prévia do admin</span>
    <span class="marca" id="marca">GGC Awards</span>
    <h1 id="titulo"></h1>
    <div class="texto" id="texto"></div>
    <a class="acao btn-seguir" id="seguir" href="urna-eletronica.html">
      Continuar para a urna
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
    </a>
    <a class="voltar" id="voltar" href="inicio.html">Voltar</a>
  </section>
</main>

<script>
/* =====================================================================
   BOAS-VINDAS — aparece depois de "Começar a votar", antes da urna.
   Título e texto vêm de eleicao.boas_vindas_titulo / boas_vindas_texto (o admin edita
   em admin-boas-vindas.html). Sem texto configurado, vai direto para a urna.
   ?previa=1 : prévia do admin (não redireciona e o botão volta para o editor).
   ===================================================================== */

const $ = (id) => document.getElementById(id);
const PREVIA = new URLSearchParams(location.search).has('previa');
const URL_URNA = 'urna-eletronica.html';

(async function iniciar() {
  const { conta } = await GGC.exigirSessao();
  const admin = conta.role === 'admin' || conta.role === 'dev';
  const { data: el, error } = await sb.from('eleicao')
    .select('ano, boas_vindas_titulo, boas_vindas_texto').eq('id', 1).single();

  // sem texto (ou erro ao ler): não prende ninguém aqui
  if (!PREVIA && (error || !el || (!el.boas_vindas_titulo && !el.boas_vindas_texto))) {
    location.replace(URL_URNA);
    return;
  }

  $('marca').textContent = el && el.ano ? `GGC Awards ${el.ano}` : 'GGC Awards';
  $('titulo').textContent = (el && el.boas_vindas_titulo) || '';
  $('texto').innerHTML = GGC.formatarTexto(el && el.boas_vindas_texto) ||
    (PREVIA ? '<p><em>Sem texto ainda. Escreva a mensagem no editor.</em></p>' : '');

  if (PREVIA && admin) {
    $('aviso-previa').hidden = false;
    $('seguir').href = 'admin-boas-vindas.html';
    $('seguir').firstChild.textContent = 'Voltar ao editor ';
    $('voltar').hidden = true;
  } else {
    $('voltar').href = admin ? 'admin-menu.html' : 'inicio.html';
  }
  document.title = (el && el.boas_vindas_titulo) ? `${el.boas_vindas_titulo} — GGC Awards` : 'Boas-vindas — GGC Awards';
  $('seguir').focus({ preventScroll: true });
})();
</script>
</body>
</html>
