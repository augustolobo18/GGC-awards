<title>GGC Awards</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>

<body>
<noscript><a href="login.html">Entrar no GGC Awards</a></noscript>
<script>
(async function () {
  try {
    const s = await GGC.sessaoAtual();
    location.replace(s && s.conta ? GGC.destinoPorRole(s.conta.role) : GGC.LOGIN);
  } catch (e) {
    console.error(e);
    location.replace(GGC.LOGIN);
  }
})();
</script>
</body>
