<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Urna — GGC Awards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/jpeg" href="assets/logo_ggc.jpg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<style>
  :root{
    --bg:#E7E9E4; --ink:#15180F; --muted:#4F554B; --card:#fff; --line:#E3E6DF;
    --urna:#D8D3C6; --tela:#EEF0E8; --tecla:#121311; --painel:#2A2B28;
    --corrige:#E8762C; --confirma:#35A55A; --sel:#E6F4EA; --sel-borda:#2E8A4C;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
  .pagina{min-height:100vh;padding:32px 24px 48px}
  .wrap{max-width:1360px;margin:0 auto;display:flex;flex-direction:column;gap:24px}

  /* cabeçalho */
  .topo{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
  .sobre{font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  h1{margin:4px 0 0;font-family:'Space Grotesk',Inter,sans-serif;font-size:36px;line-height:1.1}
  .topo p{margin:0;max-width:460px;font-size:15px;line-height:1.5;color:var(--muted)}

  .colunas{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}

  /* urna */
  .urna-col{flex:999 1 640px;min-width:0;display:flex;flex-direction:column;gap:16px}
  .urna{background:var(--urna);border-radius:22px;padding:22px;display:flex;flex-wrap:wrap;gap:22px;
    box-shadow:inset 0 2px 0 rgba(255,255,255,.6),inset 0 -4px 0 rgba(0,0,0,.08),0 18px 40px rgba(30,35,25,.18)}
  .urna:focus{outline:none}
  .urna:focus-visible{outline:3px solid #1F5FBF;outline-offset:4px}

  .moldura{flex:1 1 340px;min-width:0;background:#2B2D29;border-radius:12px;padding:12px;box-shadow:inset 0 3px 8px rgba(0,0,0,.45)}
  .tela{position:relative;aspect-ratio:4/3;background:var(--tela);border-radius:4px;overflow:hidden;
    font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;color:#111;display:flex;flex-direction:column}
  .tela-corpo{flex:1;display:flex;flex-direction:column;padding:4% 5% 0;min-height:0}
  .tela-topo{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
  .tela-cat{display:flex;flex-direction:column;gap:6px;min-width:0}
  .seu-voto{font-size:14px;font-weight:700}
  .cat-titulo{font-size:26px;font-weight:700;line-height:1.15;text-transform:uppercase}
  .cat-desc{font-size:13px;color:#3E423A}
  .foto-box{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}
  .foto-grande{width:96px;height:120px;border:1px solid #111;display:flex;align-items:center;justify-content:center;
    font-size:34px;font-weight:700;color:#fff;object-fit:cover}
  .numero-linha{display:flex;align-items:center;gap:12px;margin-top:18px;font-size:18px}
  .caixas{display:flex;gap:6px}
  .caixa{width:40px;height:52px;display:inline-flex;align-items:center;justify-content:center;font-size:34px;font-weight:700;border:2px solid #111}
  .caixa.atual{animation:cursor .9s steps(1) infinite;background:#F7F8F3}
  .tela-meio{flex:1;display:flex;flex-direction:column;justify-content:center;gap:8px;min-height:0}
  .dados{display:flex;flex-direction:column;gap:8px;font-size:18px}
  .dados strong{text-transform:uppercase}
  .aviso{font-size:20px;font-weight:700}
  .grande{font-size:38px;font-weight:700;align-self:center;text-align:center}
  .motivo{font-size:22px;font-weight:700;align-self:center;text-align:center;line-height:1.25}
  .pisca{animation:pisca 1s steps(1) infinite}
  .instrucoes{border-top:1.5px solid #111;margin:0 3%;padding:8px 2% 12px;font-size:13px;line-height:1.5}
  .instrucoes div+div{padding-left:18px}
  .progresso{position:absolute;right:10px;bottom:6px;font-size:11px;color:#3E423A}
  .fim{flex:1;display:flex;align-items:center;justify-content:center;position:relative}
  .fim b{font-size:120px;line-height:1}
  .fim span{position:absolute;bottom:10px;right:14px;font-size:16px;font-weight:700}
  .centro{flex:1;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700}
  @keyframes pisca{0%,49%{opacity:1}50%,100%{opacity:0}}
  @keyframes cursor{0%,49%{border-color:#111}50%,100%{border-color:transparent}}

  .teclado-col{flex:0 1 300px;min-width:260px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
  .marca{display:flex;align-items:center;justify-content:space-between;padding:0 4px;
    font-family:'Space Grotesk',Inter,sans-serif;font-size:13px;font-weight:700;letter-spacing:.14em;color:#3A3D35}
  .led{width:10px;height:10px;border-radius:50%;background:#4CD07D;box-shadow:0 0 6px #4CD07D}
  .led.fim{background:var(--corrige);box-shadow:0 0 6px var(--corrige)}
  .painel{background:var(--painel);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:inset 0 2px 6px rgba(0,0,0,.5)}
  .numeros{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  .tecla{border:0;border-radius:6px;font-family:Arial,sans-serif;font-weight:700;cursor:pointer;
    transition:transform .06s ease,box-shadow .06s ease}
  .tecla:active{transform:translateY(2px)}
  .tecla:focus-visible{outline:3px solid #7FB3FF;outline-offset:2px}
  .tecla.num{height:52px;background:var(--tecla);color:#fff;font-size:24px;box-shadow:0 3px 0 #000,inset 0 1px 0 rgba(255,255,255,.12)}
  .tecla.num.zero{grid-column:2}
  .acoes{display:flex;gap:8px;align-items:flex-end}
  .tecla.acao{flex:1;height:50px;font-size:13px;color:#111}
  .tecla.c{background:var(--corrige);box-shadow:0 3px 0 #9A4710}
  .tecla.ok{flex:1.25;height:62px;background:var(--confirma);color:#0B1A0F;box-shadow:0 3px 0 #1B6332}

  .passos{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .passo{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1.5px solid #B9BEB4;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
  .passo.feito{background:#1E3A2B;color:#fff;border-color:#1E3A2B}
  .passo.atual{background:#fff;color:#111;border-color:#111}
  .novo{margin-left:auto;min-height:44px;padding:0 18px;border:0;border-radius:999px;background:var(--ink);color:#fff;font:600 14px Inter,sans-serif;cursor:pointer}
  .novo:disabled{opacity:.6;cursor:wait}
  .novo.sair-urna{background:transparent;color:var(--muted);border:1.5px solid #B9BEB4}

  /* lista */
  .lista-card{flex:1 1 340px;min-width:0;max-width:100%;background:var(--card);border-radius:18px;box-shadow:0 10px 30px rgba(30,35,25,.10);display:flex;flex-direction:column;overflow:hidden}
  .lista-head{padding:20px 20px 14px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--line)}
  .lista-head .linha{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .lista-head h2{margin:0;font-family:'Space Grotesk',Inter,sans-serif;font-size:22px}
  .lista-head small{font-size:13px;color:var(--muted)}
  .lista-head label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#3E423A}
  .busca{height:44px;padding:0 14px;border:1.5px solid #C9CEC3;border-radius:10px;font:15px Inter,sans-serif;color:var(--ink);background:#FAFBF8}
  .busca:focus{outline:none;border-color:#1F5FBF;box-shadow:0 0 0 3px rgba(31,95,191,.18)}
  .lista{height:600px;overflow-y:auto;padding:8px 8px 12px;display:flex;flex-direction:column;gap:2px;
    scrollbar-width:thin;scrollbar-color:#B9BEB4 transparent;scroll-behavior:smooth}
  .lista::-webkit-scrollbar{width:8px}
  .lista::-webkit-scrollbar-thumb{background:#B9BEB4;border-radius:8px}
  .cand{display:flex;align-items:center;gap:14px;width:100%;padding:10px 12px;border:1.5px solid transparent;border-radius:12px;
    background:#fff;text-align:left;font-family:Inter,sans-serif;color:var(--ink);cursor:pointer;transition:background .15s,border-color .15s}
  .cand:hover{background:#F2F5F0}
  .cand:focus-visible{outline:3px solid #1F5FBF;outline-offset:-3px}
  .cand.parcial{background:#F4F6F1}
  .cand.sel{background:var(--sel);border-color:var(--sel-borda)}
  .avatar{width:48px;height:48px;border-radius:50%;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
    font-size:16px;font-weight:700;color:#fff;object-fit:cover}
  .cand-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .cand-txt b,.cand-txt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cand-txt b{font-size:15px;font-weight:600}
  .cand-txt span{font-size:13px;color:var(--muted)}
  .cand-num{flex:0 0 auto;min-width:52px;height:40px;padding:0 8px;border-radius:8px;background:var(--ink);color:#fff;
    display:inline-flex;align-items:center;justify-content:center;font:700 22px Arial,sans-serif;letter-spacing:.04em}
  .vazio{margin:24px 12px;font-size:14px;color:var(--muted);text-align:center}

  /* celular: urna em largura total, teclas grandes, lista embaixo com altura limitada */
  @media (max-width:720px){
    .pagina{padding:16px 12px 32px}
    .wrap{gap:16px}
    h1{font-size:28px}
    .colunas{flex-direction:column;flex-wrap:nowrap;align-items:stretch;gap:16px}
    .urna-col{flex:0 0 auto;width:100%}
    .urna{padding:14px;gap:16px}
    .moldura{flex:1 1 100%;padding:8px}
    .tela{aspect-ratio:auto;min-height:320px}
    .tela-corpo{padding:14px 14px 0}
    .tela-topo{gap:10px}
    .cat-titulo{font-size:20px}
    .cat-desc{font-size:12px}
    .foto-grande{width:72px;height:90px;font-size:26px}
    .numero-linha{margin-top:12px;font-size:16px}
    .caixa{width:34px;height:46px;font-size:28px}
    .dados{font-size:15px}
    .aviso{font-size:17px}
    .grande{font-size:28px}
    .instrucoes{font-size:12px}
    .fim b{font-size:84px}
    .teclado-col{flex:1 1 100%;min-width:0;width:100%}
    .tecla.num{height:56px}
    .tecla.acao{height:54px}
    .tecla.ok{height:64px}
    .lista-card{flex:0 0 auto;width:100%}
    .lista{height:auto;max-height:340px}
    .cand{min-height:56px}
  }
  /* votação fora do ar (não abriu / encerrada / já votou) */
  .bloqueio{background:var(--card);border-radius:22px;box-shadow:0 10px 30px rgba(30,35,25,.10);padding:56px 24px;
    display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;max-width:560px;width:100%;margin:24px auto 0}
  .bloqueio .icone{width:72px;height:72px;border-radius:50%;background:var(--urna);display:flex;align-items:center;justify-content:center}
  .bloqueio h2{margin:0;font-family:'Space Grotesk',Inter,sans-serif;font-size:28px;line-height:1.15}
  .bloqueio p{margin:0;max-width:420px;font-size:15px;line-height:1.5;color:var(--muted)}
  .bloqueio .acoes-bloqueio{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:8px}
  .bloqueio .btn-b{min-height:48px;padding:0 22px;border-radius:12px;font:700 15px Inter,sans-serif;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
  .bloqueio .btn-b.forte{background:var(--tecla);color:#fff;border:0}
  .bloqueio .btn-b.leve{background:transparent;color:var(--muted);border:1.5px solid #B9BEB4}
  .bloqueio .btn-b:focus-visible{outline:3px solid #1F5FBF;outline-offset:2px}
  .bloqueio[hidden],.colunas[hidden],.topo p[hidden]{display:none}
</style>
</head>
<body>
<div class="pagina">
  <div class="wrap">
    <header class="topo">
      <div>
        <span class="sobre" id="sobre">GGC Awards</span>
        <h1>Hora de votar</h1>
      </div>
      <p id="instrucao">Digite os dois números do candidato no teclado da urna (ou toque no nome na lista) e aperte CONFIRMA. Dá pra usar o teclado do computador também.</p>
    </header>

    <section class="bloqueio" id="bloqueio" hidden aria-live="polite">
      <span class="icone" id="bloqueio-icone" aria-hidden="true"></span>
      <h2 id="bloqueio-titulo"></h2>
      <p id="bloqueio-texto"></p>
      <div class="acoes-bloqueio" id="bloqueio-acoes"></div>
    </section>

    <div class="colunas">
      <section class="urna-col" aria-label="Urna eletrônica">
        <div class="urna" id="urna" tabindex="0">
          <div class="moldura">
            <div class="tela" id="tela" aria-live="polite"></div>
          </div>
          <div class="teclado-col">
            <div class="marca"><span>URNA GGC</span><span class="led" id="led" aria-hidden="true"></span></div>
            <div class="painel">
              <div class="numeros" id="numeros"></div>
              <div class="acoes">
                <button type="button" class="tecla acao c" data-acao="corrige">CORRIGE</button>
                <button type="button" class="tecla acao ok" data-acao="confirma">CONFIRMA</button>
              </div>
            </div>
          </div>
        </div>
        <nav class="passos" id="passos" aria-label="Categorias"></nav>
      </section>

      <aside class="lista-card" aria-label="Lista de candidatos">
        <div class="lista-head">
          <div class="linha"><h2>Candidatos</h2><small id="total"></small></div>
          <label>Buscar por nome ou número
            <input class="busca" id="busca" type="search" placeholder="Ex.: Tiago ou 22" autocomplete="off">
          </label>
        </div>
        <div class="lista" id="lista"></div>
      </aside>
    </div>
  </div>
</div>

<script>
/* =====================================================================
   URNA — dados reais do Supabase.

   candidatos_urna(): participantes com número, EXCETO o próprio eleitor
                      (id, numero, nome, apelido, foto_url, bloqueado_principal, venceu_em).
   categorias:        id | ordem | titulo | descricao | principal (a principal vota por último)
   votar(p_votos):    [{ categoria_id, numero }], tudo de uma vez no FIM.
                      Não existe branco nem nulo: só dá para confirmar número de candidato válido
                      (existe, não é o próprio e, no GGC Of The Year, não é o admin do ano nem
                      quem venceu nos 3 anos anteriores).
                      O banco recusa o envio inteiro se algum número for inválido.
   ===================================================================== */

const SOM_LIGADO = true;
const MENSAGENS_SEM_RETRY = ['já votou', 'não está aberta'];

let SESSAO = null;

async function carregarDados() {
  const [el, votou, cands, cats] = await Promise.all([
    sb.from('eleicao').select('ano, status').eq('id', 1).single(),
    sb.rpc('ja_votei'),
    sb.rpc('candidatos_urna'),
    sb.from('categorias').select('id, ordem, titulo, descricao, principal').order('ordem'),
  ]);
  for (const r of [el, votou, cands, cats]) if (r.error) throw r.error;
  return {
    eleicao: el.data,
    jaVotou: !!votou.data,
    candidatos: cands.data || [],
    // a principal (GGC Of The Year) por último
    categorias: (cats.data || []).slice().sort((a, b) => (a.principal - b.principal) || (a.ordem - b.ordem)),
  };
}

async function enviarVotos(votos) {
  const { error } = await sb.rpc('votar', { p_votos: votos });
  if (error) throw error;
}

/* ===================================================================== */

const CORES_AVATAR = ['#2F5D8A','#7A3E8E','#A0442C','#2E7D5B','#8A6A1F','#3B4A9C','#9C2F5A','#256C78','#5E6B21','#6B3FA0'];

const estado = {
  carregando: true,
  falhaCarga: '',
  candidatos: [],
  categorias: [],
  etapa: 0,
  digitos: '',
  fim: false,
  envio: 'parado',     // 'parado' | 'enviando' | 'ok' | 'erro'
  erroEnvio: '',
  semRetry: false,
  votos: [],
  busca: '',
};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const cor = (numero) => CORES_AVATAR[parseInt(numero, 10) % CORES_AVATAR.length];
const iniciais = (nome) => {
  const p = String(nome || '').trim().split(/\s+/);
  return (((p[0] || '')[0] || '') + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase();
};
// No GGC Of The Year (principal) não concorrem o admin do ano e quem venceu nos 3 anos anteriores
// (vencedor só volta 4 anos depois): somem da lista e o número é recusado (o banco aplica a mesma
// regra em votar()). Nas outras categorias todo mundo concorre.
const candidatosDaEtapa = () => {
  const cat = estado.categorias[estado.etapa];
  return cat && cat.principal ? estado.candidatos.filter((c) => !c.bloqueado_principal) : estado.candidatos;
};
const acharCandidato = (n) => candidatosDaEtapa().find((c) => c.numero === n);

// Por que um número completo não vale (para a mensagem na tela)
function motivoInvalido(n) {
  if (SESSAO && SESSAO.conta.numero === n) return 'Você não pode votar em si mesmo.';
  const cat = estado.categorias[estado.etapa];
  const bloq = cat && cat.principal && estado.candidatos.find((c) => c.numero === n && c.bloqueado_principal);
  if (bloq) {
    return bloq.venceu_em
      ? `Venceu o GGC Of The Year em ${bloq.venceu_em}; volta a concorrer em ${bloq.venceu_em + 4}.`
      : 'O admin do ano não concorre no GGC Of The Year.';
  }
  return 'Esse número não está na disputa.';
}

/* ---------------- som ---------------- */
// Som de FIM da urna (arquivo real). O celular só deixa tocar áudio depois de um toque do usuário,
// e o FIM toca depois da resposta do servidor; por isso "destravamos" o áudio no primeiro toque/tecla.
const SOM_FIM = new Audio('assets/sons/fim.mp3');
SOM_FIM.preload = 'auto';
let somFimLiberado = false;
let tocandoFim = false;
function liberarSomFim() {
  if (somFimLiberado) return;
  somFimLiberado = true;
  SOM_FIM.muted = true;
  SOM_FIM.play().then(() => {
    if (tocandoFim) return;   // o FIM de verdade já começou: não interrompe
    SOM_FIM.pause(); SOM_FIM.currentTime = 0; SOM_FIM.muted = false;
  }).catch(() => { SOM_FIM.muted = false; somFimLiberado = false; });
}
['pointerdown', 'keydown'].forEach((ev) => document.addEventListener(ev, liberarSomFim, { capture: true }));

function tocarFim() {
  if (!SOM_LIGADO) return;
  tocandoFim = true;
  SOM_FIM.muted = false;
  SOM_FIM.currentTime = 0;
  // se o navegador recusar o arquivo, cai no bip sintetizado
  SOM_FIM.play().catch(() => bip([[1050, .09], [1050, .09], [1050, .09], [1050, .09], [1050, .55]]));
}

let audioCtx;
function bip(seq) {
  if (!SOM_LIGADO) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = audioCtx || new AC();
    let t = audioCtx.currentTime;
    for (const [freq, dur] of seq) {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'square';
      o.frequency.value = freq;
      g.gain.value = 0.04;
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + dur);
      t += dur + 0.025;
    }
  } catch (e) {}
}
// Sons reais da urna para tecla e CONFIRMA. Tocam dentro do próprio toque/tecla (o celular deixa).
// Cada toque usa uma cópia do áudio, então digitar rápido não corta o som anterior.
// Se o navegador recusar o arquivo, cai no bip sintetizado.
const SOM_TECLA = new Audio('assets/sons/tecla.mp3');
const SOM_CONFIRMA = new Audio('assets/sons/confirma.mp3');
SOM_TECLA.preload = 'auto';
SOM_CONFIRMA.preload = 'auto';
function tocarArquivo(base, reserva) {
  if (!SOM_LIGADO) return;
  try {
    base.cloneNode().play().catch(reserva);
  } catch (e) { reserva(); }
}
const somTecla = () => tocarArquivo(SOM_TECLA, () => bip([[1200, 0.05]]));
const somConfirma = () => tocarArquivo(SOM_CONFIRMA, () => bip([[1050, .09], [1050, .09], [1050, .2]]));

/* ---------------- ações da urna ---------------- */
const travada = () => estado.carregando || estado.fim || !!estado.falhaCarga;

function digitar(d) {
  if (travada() || estado.digitos.length >= 2) return;
  somTecla();
  estado.digitos += d;
  render();
}

function escolher(numero) {
  if (travada()) return;
  somTecla();
  estado.digitos = numero;
  render();
}

function apertarCorrige() {
  if (travada()) return;
  somTecla();   // na urna real o CORRIGE faz o mesmo bip das teclas
  estado.digitos = '';
  render();
}

function apertarConfirma() {
  if (travada()) return;
  if (estado.digitos.length < 2) return;
  // número que não está na disputa não confirma: avisa na tela e espera CORRIGE
  if (!acharCandidato(estado.digitos)) { bip([[300, 0.18]]); return; }

  const cat = estado.categorias[estado.etapa];
  estado.votos.push({ categoria_id: cat.id, numero: estado.digitos });

  const ultima = estado.etapa >= estado.categorias.length - 1;
  estado.digitos = '';
  estado.busca = '';
  $('busca').value = '';

  if (ultima) {
    estado.fim = true;
    render();
    enviar();
  } else {
    somConfirma();
    estado.etapa += 1;
    render();
  }
}

async function enviar() {
  if (estado.envio === 'enviando') return;
  estado.envio = 'enviando';
  estado.erroEnvio = '';
  render();
  try {
    await enviarVotos(estado.votos.slice());
    estado.envio = 'ok';
    tocarFim();
  } catch (err) {
    console.error(err);
    const m = String(err.message || '');
    estado.envio = 'erro';
    estado.semRetry = MENSAGENS_SEM_RETRY.some((t) => m.includes(t));
    estado.erroEnvio = (err.code === 'P0001' && m) ? m : 'Não deu para enviar seus votos. Confira a internet.';
  }
  render();
}

function voltarAoInicio() {
  location.href = GGC.destinoPorRole(SESSAO.conta.role);
}

/* Tela de urna fora do ar: mesma para todos; admin/dev ganham "Voltar ao menu". */
const ICONE_CADEADO = `<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#15180F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>`;
const ICONE_CHECK = `<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#2E8A4C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;
const BLOQUEIOS = {
  fechada:   { icone: ICONE_CADEADO, titulo: 'A votação ainda não abriu', texto: 'A urna libera assim que a votação for aberta. Esta tela atualiza sozinha.' },
  encerrada: { icone: ICONE_CADEADO, titulo: 'A votação foi encerrada',   texto: 'A urna está fechada. Agora é esperar o resultado.' },
  votou:     { icone: ICONE_CHECK,   titulo: 'Você já votou',             texto: 'Seu voto está registrado. Cada pessoa vota uma vez por ano.' },
};

function mostrarBloqueio(tipo) {
  const b = BLOQUEIOS[tipo];
  const admin = ['admin', 'dev'].includes(SESSAO.conta.role);
  $('bloqueio-icone').innerHTML = b.icone;
  $('bloqueio-titulo').textContent = b.titulo;
  $('bloqueio-texto').textContent = b.texto;
  $('bloqueio-acoes').innerHTML =
    (admin ? `<a class="btn-b forte" href="admin-menu.html">Voltar ao menu</a>` : '') +
    `<button type="button" class="btn-b leve" id="bloqueio-sair">Sair</button>`;
  $('bloqueio-sair').addEventListener('click', () => GGC.sair());
  $('instrucao').hidden = true;
  document.querySelector('.colunas').hidden = true;
  $('bloqueio').hidden = false;
}

// enquanto estiver bloqueada por "não abriu", libera sozinha quando o admin abrir
function esperarAbertura() {
  sb.channel('urna-status')
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'eleicao' }, (p) => {
      if (p.new && p.new.status === 'aberta') location.reload();
    })
    .subscribe();
}

/* ---------------- render ---------------- */
function avatarHTML(c, classe) {
  return c.foto_url
    ? `<img class="${classe}" src="${esc(c.foto_url)}" alt="">`
    : `<span class="${classe}" aria-hidden="true" style="background:${cor(c.numero)}">${esc(iniciais(c.nome))}</span>`;
}

function renderTela() {
  const tela = $('tela');
  if (estado.carregando) {
    tela.innerHTML = `<div class="centro">Carregando candidatos…</div>`;
    return;
  }
  if (estado.falhaCarga) {
    tela.innerHTML = `<div class="centro" style="text-align:center;padding:0 6%">${esc(estado.falhaCarga)}</div>`;
    return;
  }
  if (estado.fim) {
    if (estado.envio === 'ok') tela.innerHTML = `<div class="fim"><b>FIM</b><span>VOTOU</span></div>`;
    else if (estado.envio === 'erro') tela.innerHTML = `<div class="centro" style="flex-direction:column;gap:8px;text-align:center;padding:0 6%"><span>NÃO ENVIOU</span><span style="font-size:15px;font-weight:400">${esc(estado.erroEnvio)}</span></div>`;
    else tela.innerHTML = `<div class="centro pisca">Enviando seus votos…</div>`;
    return;
  }

  const cat = estado.categorias[estado.etapa] || { titulo: '', descricao: '' };
  const d = estado.digitos;
  const completo = d.length === 2;
  const cand = completo ? acharCandidato(d) : null;
  const errado = completo && !cand;

  const caixa = (i) =>
    `<span class="caixa${d.length === i ? ' atual' : ''}">${esc(d[i] || '')}</span>`;

  let meio = '';
  if (cand) {
    meio = `<div class="dados">
      <div>Nome: <strong>${esc(cand.nome)}</strong></div>
      <div>Apelido: <strong>${esc(cand.apelido)}</strong></div>
    </div>`;
  } else if (errado) {
    meio = `<span class="aviso">NÚMERO INVÁLIDO</span><span class="motivo pisca">${esc(motivoInvalido(d))}</span>`;
  }

  const foto = cand
    ? `<div class="foto-box">${avatarHTML(cand, 'foto-grande')}<span>Candidato</span></div>`
    : '';

  const instrucoes = cand
    ? `<div class="instrucoes">
        <div>Aperte a tecla:</div>
        <div><strong>CONFIRMA</strong> para <strong>CONFIRMAR</strong> este voto</div>
        <div><strong>CORRIGE</strong> para <strong>REINICIAR</strong> este voto</div>
      </div>`
    : errado
      ? `<div class="instrucoes">
          <div>Esse voto não pode ser confirmado.</div>
          <div>Aperte <strong>CORRIGE</strong> e digite outro número</div>
        </div>`
      : `<div style="height:12px"></div>`;

  tela.innerHTML = `
    <div class="tela-corpo">
      <div class="tela-topo">
        <div class="tela-cat">
          <span class="seu-voto">SEU VOTO PARA</span>
          <span class="cat-titulo">${esc(cat.titulo)}</span>
          <span class="cat-desc">${esc(cat.descricao)}</span>
        </div>
        ${foto}
      </div>
      <div class="numero-linha">Número: <div class="caixas">${caixa(0)}${caixa(1)}</div></div>
      <div class="tela-meio">${meio}</div>
    </div>
    ${instrucoes}
    <span class="progresso">${estado.etapa + 1} de ${estado.categorias.length}</span>`;
}

function renderLista() {
  const termo = estado.busca.trim().toLowerCase();
  const d = estado.digitos;
  const ativo = !travada();
  const daEtapa = candidatosDaEtapa();
  const filtrados = daEtapa.filter((c) =>
    !termo ||
    c.nome.toLowerCase().includes(termo) ||
    (c.apelido || '').toLowerCase().includes(termo) ||
    c.numero.includes(termo)
  );

  $('total').textContent = `${daEtapa.length} na disputa`;

  if (!filtrados.length) {
    $('lista').innerHTML = estado.carregando ? '' : `<p class="vazio">Ninguém encontrado com “${esc(estado.busca)}”.</p>`;
    return;
  }

  $('lista').innerHTML = filtrados.map((c) => {
    const sel = ativo && d.length === 2 && c.numero === d;
    const parcial = ativo && d.length === 1 && c.numero[0] === d;
    return `<button type="button" class="cand${sel ? ' sel' : parcial ? ' parcial' : ''}" data-numero="${esc(c.numero)}"
        aria-label="Votar em ${esc(c.nome)}, número ${esc(c.numero)}">
      ${avatarHTML(c, 'avatar')}
      <span class="cand-txt"><b>${esc(c.nome)}</b><span>${esc(c.apelido)}</span></span>
      <span class="cand-num">${esc(c.numero)}</span>
    </button>`;
  }).join('');

  const selecionado = $('lista').querySelector('.cand.sel');
  if (selecionado) selecionado.scrollIntoView({ block: 'nearest' });
}

function renderPassos() {
  const passos = estado.categorias.map((c, i) => {
    const feito = estado.fim || i < estado.etapa;
    const classe = feito ? 'feito' : i === estado.etapa ? 'atual' : '';
    const check = feito
      ? `<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>`
      : '';
    return `<span class="passo ${classe}">${check}${esc(c.titulo)}</span>`;
  }).join('');
  let botao = '';
  if (estado.fim && estado.envio === 'ok') botao = `<button type="button" class="novo" id="voltar">Voltar ao início</button>`;
  else if (estado.fim && estado.envio === 'erro') {
    botao = estado.semRetry
      ? `<button type="button" class="novo" id="voltar">Voltar ao início</button>`
      : `<button type="button" class="novo" id="tentar">Tentar de novo</button>`;
  } else if (estado.fim) botao = `<button type="button" class="novo" disabled>Enviando…</button>`;
  else if (!estado.carregando) botao = `<button type="button" class="novo sair-urna" id="voltar">Sair da urna</button>`;
  $('passos').innerHTML = passos + botao;
}

function render() {
  renderTela();
  renderLista();
  renderPassos();
  $('led').classList.toggle('fim', estado.fim);
}

/* ---------------- eventos ---------------- */
function montarTeclado() {
  const ordem = ['1','2','3','4','5','6','7','8','9','0'];
  $('numeros').innerHTML = ordem.map((d) =>
    `<button type="button" class="tecla num${d === '0' ? ' zero' : ''}" data-digito="${d}" aria-label="Número ${d}">${d}</button>`
  ).join('');
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.digito) digitar(t.dataset.digito);
  else if (t.dataset.acao === 'corrige') apertarCorrige();
  else if (t.dataset.acao === 'confirma') apertarConfirma();
  else if (t.dataset.numero) escolher(t.dataset.numero);
  else if (t.id === 'voltar') voltarAoInicio();
  else if (t.id === 'tentar') enviar();
});

$('urna').addEventListener('keydown', (e) => {
  const k = e.key;
  if (/^[0-9]$/.test(k)) { e.preventDefault(); digitar(k); }
  else if (k === 'Enter') { e.preventDefault(); apertarConfirma(); }
  else if (k === 'Backspace' || k === 'Delete' || k === 'Escape') { e.preventDefault(); apertarCorrige(); }});

$('busca').addEventListener('input', (e) => {
  estado.busca = e.target.value;
  renderLista();
});

/* ---------------- início ---------------- */
(async function iniciar() {
  SESSAO = await GGC.exigirSessao();   // qualquer role logada (admin também vota)
  montarTeclado();
  render();
  try {
    const d = await carregarDados();
    $('sobre').textContent = `GGC Awards ${d.eleicao.ano}`;
    document.title = `Urna — GGC Awards ${d.eleicao.ano}`;
    // votação fechada/encerrada ou voto já registrado: mostra a tela de urna fora do ar
    if (d.eleicao.status === 'fechada') { mostrarBloqueio('fechada'); esperarAbertura(); return; }
    if (d.eleicao.status !== 'aberta')  { mostrarBloqueio('encerrada'); return; }
    if (d.jaVotou)                      { mostrarBloqueio('votou'); return; }
    estado.candidatos = d.candidatos;
    estado.categorias = d.categorias;
    if (!d.categorias.length) estado.falhaCarga = 'Ainda não há categorias cadastradas.';
  } catch (err) {
    console.error(err);
    estado.falhaCarga = 'Não deu para carregar a urna. Recarregue a página.';
  }
  estado.carregando = false;
  render();
  $('urna').focus();
})();
</script>
